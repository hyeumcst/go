<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYEUMCST 매출/매입 관리 (관리자)</title>
<link rel="stylesheet" href="../assets/style.css">
<script>
  // 첫 그림 전에 테마를 적용해 깜빡임을 막는다
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
  var SITE = 'admin';
</script>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>
  <div id="app"></div>

  <script>
    /* 화면이 멈추면 빈 화면만 남으므로, 무엇이 잘못됐는지 보여준다 */
    (function () {
      var shown = false;
      function show(t, d) {
        if (shown) return; shown = true;
        var app = document.getElementById('app');
        if (!app) return;
        app.innerHTML =
          '<div style="max-width:40rem;margin:8vh auto;padding:1.5rem;line-height:1.7;'
          + 'font-family:system-ui,-apple-system,Malgun Gothic,sans-serif">'
          + '<h2 style="margin:0 0 .6rem;font-size:1.15rem">화면을 여는 중 문제가 생겼습니다</h2>'
          + '<pre style="white-space:pre-wrap;word-break:break-all;background:#f6f8fa;'
          + 'border:1px solid #e3e6ea;border-radius:8px;padding:1rem;font-size:.8rem;margin:0">'
          + String(t + '\n' + d).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>'
          + '<button onclick="try{localStorage.clear()}catch(e){};location.reload()" '
          + 'style="margin-top:1rem;padding:.6rem 1rem;border:1px solid #cfd8e3;background:#fff;'
          + 'border-radius:8px;cursor:pointer">기억을 지우고 다시 열기</button></div>';
      }
      window.addEventListener('error', function (e) {
        show(e.message || '알 수 없는 오류',
          (e.filename || '') + ' ' + (e.lineno || '') + '행'
          + (e.error && e.error.stack ? '\n\n' + e.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('처리되지 않은 오류', (r && (r.stack || r.message)) || String(r));
      });
    })();
  </script>

  <!-- 엑셀 파일을 브라우저에서 직접 만들고 읽기 위한 것 -->
  <script src="../assets/xlsx.min.js"></script>
  <script src="../app-url.js"></script>
  <script src="../assets/api.js"></script>
  <script src="../assets/app.js"></script>
</body>
</html>
